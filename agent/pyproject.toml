[project]
name = "x402-agent"
version = "0.1.0"
description = "Command line x402 client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "eth-account>=0.14.0",
    "httpx>=0.27",
    "python-dotenv>=1.2.4",
]

[project.scripts]
x402-agent = "x402_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/x402_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
