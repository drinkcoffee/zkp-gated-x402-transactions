[project]
name = "zkp-prover"
version = "0.1.0"
description = "Generate zero knowledge proofs ready to submit to Base"
requires-python = ">=3.11"
dependencies = [
    "eth-abi>=5",
    "eth-hash[pycryptodome]>=0.7",
    "eth-utils>=5",
    "httpx>=0.27",
    "python-dotenv>=1",
]

[project.scripts]
zkp-prove = "zkp_prover.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zkp_prover"]

[tool.pytest.ini_options]
testpaths = ["tests"]
