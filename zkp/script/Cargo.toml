[package]
name = "zkp-host"
version = "0.1.0"
edition = "2021"

[dependencies]
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SP1 6.10 produces v6.1.0 proofs. The v6.0.0 verifiers on Base are frozen, so proofs
# from SP1 versions that use the v6.0.0 circuits would be rejected.
sp1-sdk = { version = "6.10", features = ["blocking", "network"] }
zkp-lib = { path = "../lib" }

[build-dependencies]
sp1-build = "6.10"
